description: Mirror Docker image to ECR

parameters:
  source_name:
    description: Name of the source docker image
    type: string
  source_tag:
    description: Tag of the source docker image
    type: string
  mirror_name:
    description: Name of the mirror docker image in ECR. If empty then the source_name is used.
    type: string
    default: ""
  mirror_tag:
    description: Tag of the mirror docker image in ECR. If empty then the source_tag is used.
    type: string
    default: ""
  force:
    description: If true then force mirroring the image even if it already exists in ECR
    type: boolean
    default: false
  overwrite_only_existing:
    description: If true then overwrite the image only when the target tag already exists in ECR. The job fails if the tag is missing. After overwrite, the previous image digest is deleted from ECR.
    type: boolean
    default: false
  aws_profile:
    description: The AWS profile to be used
    type: string
    default: "default"
  region:
    description: The AWS region for the deployment
    type: string
    default: eu-west-1

executor: machine

environment:
  AWS_PROFILE: << parameters.aws_profile >>
  AWS_DEFAULT_REGION: << parameters.region >>

steps:
  - attach_workspace:
      at: ~/workdir
  - run_aws:
      cmd_name: Mirroring image to ECR repository
      deploy: true
      cmd: |
        echo "Logging in to Dockerhub..."
        echo $DOCKER_PASS | docker login -u "$DOCKER_USER" --password-stdin

        export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        export ECR_URL=${ACCOUNT_ID}.dkr.ecr.<< parameters.region >>.amazonaws.com
        export ECR_PASSWORD=$(aws ecr get-login-password --region << parameters.region >>)
        echo "Logging in to ECR: ${ECR_URL}"
        echo ${ECR_PASSWORD} | docker login -u AWS --password-stdin ${ECR_URL}

        SRC_NAME="<< parameters.source_name >>"
        SRC_TAG="<< parameters.source_tag >>"
        SRC="${SRC_NAME}:${SRC_TAG}"

        MIRROR_NAME="<< parameters.mirror_name >>"
        MIRROR_NAME="${MIRROR_NAME:-${SRC_NAME}}"
        MIRROR_TAG="<< parameters.mirror_tag >>"
        MIRROR_TAG="${MIRROR_TAG:-${SRC_TAG}}"
        MIRROR="${MIRROR_NAME}:${MIRROR_TAG}"

        echo "Mirroring ${SRC} to ${ECR_URL}/${MIRROR}..."
        OLD_IMAGE_DIGEST=$(aws ecr describe-images --repository-name=${MIRROR_NAME} --image-ids=imageTag=${MIRROR_TAG} --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
        [[ -z "${OLD_IMAGE_DIGEST}" || "${OLD_IMAGE_DIGEST}" == "None" ]] && OLD_IMAGE_DIGEST=""

        if << parameters.overwrite_only_existing >> && [[ -z "${OLD_IMAGE_DIGEST}" ]]; then
          echo "Mirror target ${MIRROR} does not exist in ECR and overwrite_only_existing is enabled."
          exit 1
        fi

        if [[ -z "${OLD_IMAGE_DIGEST}" ]] || << parameters.force >> || << parameters.overwrite_only_existing >>; then
          docker pull ${SRC}
          docker tag  ${SRC} ${ECR_URL}/${MIRROR}
          docker push ${ECR_URL}/${MIRROR}
          if << parameters.overwrite_only_existing >> && [[ -n "${OLD_IMAGE_DIGEST}" ]]; then
            echo "Deleting previous untagged image ${OLD_IMAGE_DIGEST} from ECR..."
            aws ecr batch-delete-image --repository-name=${MIRROR_NAME} --image-ids imageDigest=${OLD_IMAGE_DIGEST}
          fi
        else
          echo "${MIRROR} image is already in ECR"
        fi
